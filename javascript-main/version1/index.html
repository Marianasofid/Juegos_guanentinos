<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Piedra, Papel o Tijeras</title>
<style>
.back-home{position:fixed;z-index:999999;top:14px;left:14px;padding:10px 16px;border:2px solid #ff62c1;border-radius:999px;background:#08060de8;color:#fff!important;text-decoration:none!important;font:700 14px Arial;box-shadow:0 0 16px #ff62c144;backdrop-filter:blur(8px);transition:.2s}
.back-home:hover{background:#ff62c1;color:#08060d!important;transform:scale(1.04)}
</style></head>
<body><a class="back-home" href="../../index.html">← Menú de juegos</a>
    <section class="game">
        <!--Title -->
        <div class="title">Rock, Paper, Scissors</div>
        
          <!--Display Score of player and computer -->
        <div class="score">  
            <div class="playerScore">
                <h2>You</h2>
                <p class="p-count count">0</p>

            </div>       
            <div class="computerScore">
                <h2>Computer</h2>
                <p class="c-count count">0</p>

            </div>
        </div>
      
        <div class="move">Choose your move</div>
        
          <!--Number of moves left before game ends -->
        <div class="movesleft">Moves Left: 10 </div>
        
          <!--Options available to player to play game -->
        <div class="options">
            <button class="rock">Rock</button>
            <button class="paper">Paper</button>
            <button class="scissor">Scissors</button>    
        </div>
        
          <!--Final result of game -->
        <div class="result"></div>
        
          <!--Reload the game -->
        <button class="reload"></button>

    </section>

    <script src="app.js"></script>
</body>
</html>
